<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 Stream Player with Playlist</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        video {
            margin: 20px 0;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
        li:hover {
            color: darkblue;
        }
    </style>
</head>
<body>
    <h1>M3U8 Stream Player with Playlist</h1>
    <video id="videoPlayer" controls width="640" height="360"></video>
    <ul id="playlist">
        <li data-src="https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index_5.m3u8">CNA</li>
        <li data-src="http://z.b.bkpcp.top/m.php?id=cctv5,">CCTV5</li>
        <li data-src="http://z.b.bkpcp.top/m.php?id=cctv5p">CCTV5+</li>
    </ul>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const video = document.getElementById('videoPlayer');
        const playlistItems = document.querySelectorAll('#playlist li');

        function playVideo(src) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(src);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = src;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            }
        }

        playlistItems.forEach(item => {
            item.addEventListener('click', function () {
                const src = this.getAttribute('data-src');
                playVideo(src);
            });
        });

        // Auto-play the first video in the playlist
        if (playlistItems.length > 0) {
            playVideo(playlistItems[0].getAttribute('data-src'));
        }
    </script>
</body>
</html>
